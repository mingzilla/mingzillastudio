<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lowpoly Valley — a little 3D city</title>
<style>
  :root{
    --ink:#2b3440;
    --panel:rgba(255,253,247,.90);
    --edge:rgba(120,105,80,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#bfe0ef}
  body{
    font-family:ui-rounded,"Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #hud{
    position:fixed;top:14px;left:14px;z-index:10;
    background:var(--panel);border:1px solid var(--edge);border-radius:16px;
    padding:12px 14px;box-shadow:0 8px 24px rgba(60,50,30,.18);
    max-width:300px;backdrop-filter:blur(6px);
  }
  #hud h1{margin:0 0 2px;font-size:16px}
  #hud .sub{font-size:11px;opacity:.6;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px;align-items:center}
  .keys kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:#f0ece1;border:1px solid var(--edge);border-bottom-width:2px;
    border-radius:6px;padding:2px 6px;white-space:nowrap;
  }
  #stats{
    margin-top:10px;padding-top:9px;border-top:1px solid var(--edge);
    font-size:11.5px;opacity:.72;display:flex;gap:12px;flex-wrap:wrap;
    font-variant-numeric:tabular-nums;
  }
  #stats b{font-weight:700}

  #seedbar{
    position:fixed;bottom:14px;left:14px;z-index:10;
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    padding:8px 10px;display:flex;gap:8px;align-items:center;
    box-shadow:0 6px 18px rgba(60,50,30,.16);font-size:12px;
  }
  #seedbar input{
    width:96px;font:inherit;font-size:12px;padding:4px 7px;
    border:1px solid var(--edge);border-radius:8px;background:#fff;color:inherit;
  }
  #seedbar button{
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    background:#e9f0d8;border:1px solid var(--edge);border-radius:8px;padding:5px 11px;color:inherit;
  }
  #seedbar button:hover{background:#dfe9c8}

  #hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(43,52,64,.72);color:#fff;font-size:12.5px;
    padding:7px 14px;border-radius:999px;pointer-events:none;
    opacity:0;transition:opacity .5s;
  }
  #hint.on{opacity:1}

  #fail{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;text-align:center;
    background:#f7f3e8;padding:30px;
  }
  #fail div{max-width:420px}
  #fail h2{margin:0 0 8px;font-size:20px}
  #fail p{margin:0;font-size:14px;line-height:1.5;opacity:.75}

  @media (max-width:640px){
    #hud{max-width:220px;padding:10px 11px}
    .keys{font-size:11.5px}
    #stats{display:none}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="hud">
  <h1>Lowpoly Valley</h1>
  <p class="sub">a little 3d city</p>
  <div class="keys">
    <kbd>W A S D</kbd><span>walk</span>
    <kbd>Q</kbd> <span>turn the camera</span>
    <kbd>E</kbd> <span>turn the other way</span>
    <kbd>Shift</kbd><span>run</span>
    <kbd>Space</kbd><span>plant a tree</span>
    <kbd>&minus; +</kbd><span>zoom</span>
  </div>
  <div id="stats">
    <span>fps <b id="sFps">–</b></span>
    <span>tiles <b id="sTiles">–</b></span>
    <span>trees <b id="sTrees">–</b></span>
    <span>folk <b id="sFolk">–</b></span>
    <span id="sWhere">–</span>
  </div>
</div>

<div id="seedbar">
  <label for="seed">seed</label>
  <input id="seed" value="7" inputmode="numeric">
  <button id="regen">New valley</button>
</div>

<div id="hint"></div>

<div id="fail">
  <div>
    <h2>Couldn't load D3</h2>
    <p>The page pulls d3 v7 from a CDN, so it needs an internet connection the first time.
       Check the network and reload.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
"use strict";

if (typeof d3 === "undefined") {
  document.getElementById("fail").style.display = "flex";
  throw new Error("d3 not loaded");
}

/* =========================================================================
   1.  PALETTE
   Faces store a colour index and a world normal. The colour actually drawn
   is looked up from a table of flat light bands, so shading a face costs one
   array index — no per-frame colour maths, no string building.
   ========================================================================= */

const COLORS = {
  grassA:"#84bd52", grassB:"#78b148", grassC:"#8fc95e", grassD:"#6ea43f",
  forestFloor:"#5f9440",
  sand:"#dfcf9f",
  water:"#3f9fd4", waterDeep:"#2f86bd",
  rock:"#9ea4a9", rockDark:"#7f868d",
  soil:"#b5895c", base:"#96704c",
  trunk:"#7a5230",
  pineA:"#3f7d45", pineB:"#356e3c", pineC:"#4a8c50",
  leafA:"#4f8f3f", leafB:"#5da345", leafC:"#3d7a34",
  autumnA:"#d9793a", autumnB:"#c85a34", autumnC:"#e0a13c",
  wallA:"#f2e4ca", wallB:"#e6d3b3",
  roofA:"#c9503c", roofB:"#b8432f", roofC:"#8a5aa0", roofD:"#c98a3a",
  cropA:"#d9b955", cropB:"#b99a3f",
  river:"#5cb2de",
  plank:"#b08a5c", timber:"#7d5a3c",
  churchWall:"#f4efe2", churchRoof:"#7b6fa6", gold:"#e0b23c",
  millWall:"#eadfc4", stone:"#bdb6a8",
  barnWall:"#bf5b41", barnRoof:"#7e5c46",
  lamp:"#ffd469",
  hull:"#8a5a3a", trim:"#c9563f",
  sheep:"#f6f3e8", cow:"#f7f3ea", cowPatch:"#403c37",
  deer:"#b07a48", deerLight:"#e2c9a4", hen:"#f1e7d0", comb:"#d9503c",
  goat:"#c9bda6", goatHorn:"#8a7d68",
  coat:"#d94f43", trousers:"#3f4a5a", skin:"#f0cba0", hat:"#f5efe0",
  shadow:"#2f4a26"
};

const CNAMES = Object.keys(COLORS);
const CIDX = {};
CNAMES.forEach((k, i) => CIDX[k] = i);

/* Six flat bands. The low-poly staple: no gradients on the geometry itself. */
const BAND_K = [0.50, 0.64, 0.78, 0.92, 1.05, 1.18];
const SHADES = CNAMES.map(k => {
  const c = d3.hsl(COLORS[k]);
  return BAND_K.map(b => d3.hsl(c.h, c.s, Math.max(0.05, Math.min(0.97, c.l * b))).formatHex());
});

/* =========================================================================
   2.  SEEDED RANDOM + NOISE
   d3.randomLcg gives a reproducible stream, so a seed always builds the same
   valley. d3.shuffle isn't seedable, so shuffleSeeded does its own.
   ========================================================================= */

let rng = d3.randomLcg(1);
const rnd = () => rng();
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rng());

function shuffleSeeded(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

const PERM = new Uint8Array(512);
function buildPerm() {
  const p = shuffleSeeded(d3.range(256));
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
const hash2 = (ix, iy) => PERM[(PERM[ix & 255] + (iy & 255)) & 255] / 255;

function smoothstep(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = smoothstep(0, 1, x - ix), fy = smoothstep(0, 1, y - iy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}
function fbm(x, y, oct) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { v += amp * noise2(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
  return v / norm;
}

/* =========================================================================
   3.  HEX GRID  (pointy-top, axial)
   ========================================================================= */

const SQ3 = Math.sqrt(3);
const HEX_R = 19;
const SEA = 0;                     // water sits here
const STEP = 0.50;                 // terrain height quantum
const BASE_Z = SEA - 2.0;          // underside of the diorama block

const hexCenter = (q, r) => ({ x: SQ3 * (q + r / 2), y: 1.5 * r });
const key = (q, r) => q + "," + r;

function worldToAxial(x, y) {
  const fq = (SQ3 / 3) * x - y / 3;
  const fr = (2 / 3) * y;
  let cx = fq, cz = fr, cy = -cx - cz;
  let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
  const dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);
  if (dx > dy && dx > dz) rx = -ry - rz;
  else if (dy > dz) ry = -rx - rz;
  else rz = -rx - ry;
  return { q: rx, r: rz };
}

const CORNER = d3.range(6).map(i => {
  const a = Math.PI / 180 * (60 * i - 30);
  return { x: Math.cos(a), y: Math.sin(a), a };
});

const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

/* Which neighbour lies across edge i? Derived from the corner geometry so
   the two can't quietly drift apart. */
const EDGE_TO_DIR = d3.range(6).map(i => {
  const a = CORNER[i].a, b = CORNER[(i + 1) % 6].a;
  const mid = Math.atan2(Math.sin(a) + Math.sin(b), Math.cos(a) + Math.cos(b));
  let best = 0, bestD = 9;
  DIRS.forEach((d, k) => {
    const n = hexCenter(d[0], d[1]);
    const ang = Math.atan2(n.y, n.x);
    const diff = Math.abs(((ang - mid + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (diff < bestD) { bestD = diff; best = k; }
  });
  return best;
});

/* =========================================================================
   4.  LOW-POLY PRIMITIVES
   Each appends flat-shaded faces to `out`. A face is {p:[[x,y,z]..], n:[..], c:idx}.
   Coordinates are local to the entity; the renderer offsets by the entity origin.
   Only triangles and quads are produced, which the renderer relies on.
   ========================================================================= */

function faceNormal(p) {
  const ax = p[1][0] - p[0][0], ay = p[1][1] - p[0][1], az = p[1][2] - p[0][2];
  const bx = p[2][0] - p[0][0], by = p[2][1] - p[0][1], bz = p[2][2] - p[0][2];
  const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
  const L = Math.hypot(nx, ny, nz) || 1;
  return [nx / L, ny / L, nz / L];
}
function push(out, pts, ci) { out.push({ p: pts, n: faceNormal(pts), c: ci }); }

function prism(out, cx, cy, z0, z1, rad, sides, rot, ci) {
  const ring = [];
  for (let i = 0; i < sides; i++) {
    const a = rot + i * Math.PI * 2 / sides;
    ring.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
  }
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    push(out, [
      [ring[i][0], ring[i][1], z0], [ring[j][0], ring[j][1], z0],
      [ring[j][0], ring[j][1], z1], [ring[i][0], ring[i][1], z1]
    ], ci);
  }
}

function cone(out, cx, cy, z0, rad, height, sides, rot, ci) {
  const apex = [cx, cy, z0 + height];
  const ring = [];
  for (let i = 0; i < sides; i++) {
    const a = rot + i * Math.PI * 2 / sides;
    ring.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, z0]);
  }
  for (let i = 0; i < sides; i++) push(out, [ring[i], ring[(i + 1) % sides], apex], ci);
}

/* bipyramid — the chunky low-poly blob, with a little irregularity */
function blob(out, cx, cy, cz, rad, height, sides, rot, ci) {
  const top = [cx, cy, cz + height * 0.58];
  const bot = [cx, cy, cz - height * 0.42];
  const ring = [];
  for (let i = 0; i < sides; i++) {
    const a = rot + i * Math.PI * 2 / sides;
    const j = 0.84 + 0.30 * hash2(Math.round(cx * 13 + i * 7), Math.round(cy * 13));
    ring.push([cx + Math.cos(a) * rad * j, cy + Math.sin(a) * rad * j, cz]);
  }
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    push(out, [ring[i], ring[j], top], ci);
    push(out, [ring[j], ring[i], bot], ci);
  }
}

function box(out, cx, cy, z0, hx, hy, h, rot, ci) {
  const c = Math.cos(rot), s = Math.sin(rot);
  const cs = [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]]
    .map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
  const z1 = z0 + h;
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    push(out, [
      [cs[i][0], cs[i][1], z0], [cs[j][0], cs[j][1], z0],
      [cs[j][0], cs[j][1], z1], [cs[i][0], cs[i][1], z1]
    ], ci);
  }
  push(out, cs.map(p => [p[0], p[1], z1]), ci);
}

/* a point offset in the entity's own rotated frame */
function off(rot, dx, dy) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return [dx * c - dy * s, dx * s + dy * c];
}

/* flat double-sided quad — sails and awnings have no thickness worth modelling,
   but they must not vanish when the camera swings behind them */
function slab(out, a, b, c, d, ci) {
  push(out, [a, b, c, d], ci);
  push(out, [d, c, b, a], ci);
}

/* gabled roof: a triangular prism, which is what most roofs actually are */
function gableRoof(out, cx, cy, z0, hx, hy, h, rot, ci) {
  const P = (x, y, z) => { const [ox, oy] = off(rot, x, y); return [cx + ox, cy + oy, z]; };
  const z1 = z0 + h;
  const a0 = P(-hx, -hy, z0), a1 = P(hx, -hy, z0);
  const b0 = P(-hx, hy, z0), b1 = P(hx, hy, z0);
  const r0 = P(-hx, 0, z1), r1 = P(hx, 0, z1);
  push(out, [a0, a1, r1, r0], ci);      // pitch facing -y
  push(out, [r0, r1, b1, b0], ci);      // pitch facing +y
  push(out, [a0, r0, b0], ci);          // gable ends
  push(out, [a1, b1, r1], ci);
}

/* =========================================================================
   5.  WORLD
   ========================================================================= */

const BIOME = { WATER: 0, SAND: 1, GRASS: 2, FOREST: 3, FIELD: 4, RIVER: 5 };
const BIOME_NAME = ["water", "shore", "grass", "forest", "fields", "river"];

let tiles = new Map();
let tileList = [];
let entities = [];
let treeCount = 0;

function buildWorld(seed) {
  rng = d3.randomLcg(seed);
  buildPerm();
  tiles = new Map(); tileList = []; entities = []; treeCount = 0;

  const R = HEX_R;
  for (let q = -R; q <= R; q++) {
    for (let r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) {
      const c = hexCenter(q, r);
      const dist = Math.hypot(c.x, c.y) / (SQ3 * R * 0.95);
      const falloff = 1 - smoothstep(0.55, 0.98, dist);

      /* Snap the height to a quantum. Without this every hex sits at its own
         height and the whole valley reads as a staircase of little brown
         cliffs; snapped, you get flat plains that occasionally step. */
      const base = fbm(c.x * 0.062 + 40.5, c.y * 0.062 + 40.5, 3);
      const hRaw = base * falloff * 3.2 - 0.20;
      const h = Math.round(hRaw / STEP) * STEP;

      const moist = fbm(c.x * 0.095 + 310.7, c.y * 0.095 + 310.7, 3);
      const season = fbm(c.x * 0.052 + 880.1, c.y * 0.052 + 880.1, 2);

      /* Sand is decided in the second pass — it means "touching water", not
         "low ground", or the whole lowest terrace turns into one vast beach. */
      const biome = h <= SEA ? BIOME.WATER : BIOME.GRASS;

      const wx = new Array(6), wy = new Array(6);
      for (let i = 0; i < 6; i++) { wx[i] = c.x + CORNER[i].x; wy[i] = c.y + CORNER[i].y; }

      const t = {
        q, r, cx: c.x, cy: c.y, h, biome, moist, season,
        rz: biome === BIOME.WATER ? SEA : h,
        nb: new Array(6).fill(null),
        wx, wy,
        top: CIDX.grassA, side: CIDX.soil, rows: null,
        _vis: false, _d: 0
      };
      tiles.set(key(q, r), t);
      tileList.push(t);
    }
  }

  tileList.forEach(t => {
    for (let i = 0; i < 6; i++) {
      const d = DIRS[EDGE_TO_DIR[i]];
      t.nb[i] = tiles.get(key(t.q + d[0], t.r + d[1])) || null;
    }
  });

  carveRiver();

  // second pass: biome, now that we know who touches water
  tileList.forEach(t => {
    if (t.biome === BIOME.WATER) {
      // open sea reads darker than the shallows, so the coast has some depth
      const shallow = t.nb.some(n => n && n.biome !== BIOME.WATER);
      t.top = shallow ? CIDX.water : CIDX.waterDeep;
      t.side = CIDX.base;
      return;
    }
    if (t.biome === BIOME.RIVER) {
      t.top = CIDX.river;
      t.side = CIDX.soil;
      return;
    }
    const shore = t.nb.some(n => n && (n.biome === BIOME.WATER || n.biome === BIOME.RIVER));
    if (shore) t.biome = BIOME.SAND;
    else if (t.moist > 0.55) t.biome = BIOME.FOREST;
    else if (t.moist < 0.405) t.biome = BIOME.FIELD;
    else t.biome = BIOME.GRASS;

    t.top = topColorFor(t.biome, t);
    /* Furrow direction comes from a slow noise, not a per-tile hash, so a run
       of field tiles ploughs the same way instead of hatching against itself. */
    if (t.biome === BIOME.FIELD) {
      const ang = fbm(t.cx * 0.019 + 700.3, t.cy * 0.019 + 700.3, 2) * Math.PI * 1.6;
      t.rows = makeFurrows(t.wx, t.wy, ang);
    }
  });

  decorate();
}

/* A river runs from the highest ground down to the sea. Each tile in the path
   is dropped to a level that falls as it goes, so the banks read as a valley
   rather than a canal floating above the fields. */
function carveRiver() {
  let src = null, best = -Infinity;
  for (const t of tileList) {
    if (t.biome === BIOME.WATER) continue;
    const mid = t.cx * t.cx + t.cy * t.cy;
    const score = t.h - mid * 0.004;             // high, and not right on the edge
    if (score > best) { best = score; src = t; }
  }
  if (!src) return;

  const path = [];
  const seen = new Set();
  let cur = src, riverH = src.h;
  for (let step = 0; step < 240; step++) {
    if (!cur || seen.has(key(cur.q, cur.r))) break;
    seen.add(key(cur.q, cur.r));
    path.push(cur);
    if (cur.biome === BIOME.WATER) break;        // reached the sea
    riverH = Math.min(riverH - 0.30, cur.h);
    let nxt = null, nbest = Infinity;
    for (const d of DIRS) {
      const n = tiles.get(key(cur.q + d[0], cur.r + d[1]));
      if (!n || seen.has(key(n.q, n.r))) continue;
      const score = n.h - Math.hypot(n.cx, n.cy) * 0.05;   // downhill first, outward as a tiebreak
      if (score < nbest) { nbest = score; nxt = n; }
    }
    if (!nxt) break;
    cur = nxt;
  }
  if (path.length < 4) return;

  path.forEach((t, i) => {
    if (t.biome === BIOME.WATER) return;
    t.biome = BIOME.RIVER;
    t.h = i === 0 ? t.h : Math.min(t.h, path[i - 1].h - 0.30);
    t.rz = t.h;
  });

  /* Widen it: one hex to alternating sides of the flow, so it reads as a river
     rather than a canal someone dug in a straight line. */
  const wide = [];
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i];
    if (b.biome !== BIOME.RIVER) continue;
    const ang = Math.atan2(b.cy - a.cy, b.cx - a.cx) + (i % 2 ? Math.PI / 2 : -Math.PI / 2);
    const w2 = worldToAxial(b.cx + Math.cos(ang) * 1.25, b.cy + Math.sin(ang) * 1.25);
    const n = tiles.get(key(w2.q, w2.r));
    if (n && n.biome !== BIOME.WATER && n.biome !== BIOME.RIVER) wide.push([n, b.rz]);
  }
  wide.forEach(([n, hz]) => {
    n.biome = BIOME.RIVER;
    n.h = Math.min(n.h, hz);
    n.rz = n.h;
  });

  /* Bridges, or the river can cut the island in half and strand the player.
     Rotated square across the flow. */
  const crossable = path.filter(t => t.biome === BIOME.RIVER);
  for (let n = 0; n < 2 && crossable.length > 4; n++) {
    const t = crossable[Math.floor(crossable.length * (n + 1) / 3)];
    const i = path.indexOf(t);
    const a = path[Math.max(0, i - 1)], b = path[Math.min(path.length - 1, i + 1)];
    t.bridge = true;
    t.bridgeRot = Math.atan2(b.cy - a.cy, b.cx - a.cx) + Math.PI / 2;
  }
}

function topColorFor(biome, t) {
  if (biome === BIOME.RIVER) return CIDX.river;
  if (biome === BIOME.WATER) return CIDX.water;
  if (biome === BIOME.SAND) return CIDX.sand;
  if (biome === BIOME.FOREST) return CIDX.forestFloor;
  if (biome === BIOME.FIELD) return CIDX.cropA;
  const p = hash2(Math.round(t.cx * 7), Math.round(t.cy * 7));
  return p < 0.28 ? CIDX.grassA : p < 0.56 ? CIDX.grassB : p < 0.81 ? CIDX.grassC : CIDX.grassD;
}

/* Furrows: clip the hex against a slab running across it. Doing this in world
   space (rather than in screen space) keeps them stuck to the ground as the
   camera turns. */
function makeFurrows(wx, wy, ang) {
  const nx = Math.cos(ang), ny = Math.sin(ang);
  let mn = Infinity, mx = -Infinity;
  const poly = [];
  for (let i = 0; i < 6; i++) {
    const d = wx[i] * nx + wy[i] * ny;
    if (d < mn) mn = d;
    if (d > mx) mx = d;
    poly.push([wx[i], wy[i]]);
  }
  const rows = [];
  const n = 3;
  for (let k = 0; k < n; k++) {
    const a = mn + (mx - mn) * (k / n) + 0.03;
    const b = mn + (mx - mn) * ((k + 0.34) / n);
    let seg = clipHalf(poly, nx, ny, b);
    if (seg.length >= 3) seg = clipHalf(seg, -nx, -ny, -a);
    if (seg.length >= 3) rows.push(seg);
  }
  return rows;
}

function clipHalf(poly, nx, ny, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
      const t = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
    }
  }
  return out;
}

/* ---- trees, rocks, houses ---- */

function tileSpot(t, spread) {
  const ang = rng() * Math.PI * 2;
  const rad = spread * Math.sqrt(rng());
  const x = t.cx + Math.cos(ang) * rad, y = t.cy + Math.sin(ang) * rad;
  const w = worldToAxial(x, y);
  return { x, y, owner: tiles.get(key(w.q, w.r)) || t };
}

function addTree(t, forest) {
  const spot = tileSpot(t, forest ? 0.74 : 0.40);
  if (!dryLand(spot.owner)) return;
  const autumn = t.season > 0.66;
  const e = {
    kind: autumn ? "autumn" : (rng() < 0.62 ? "pine" : "leaf"),
    x: spot.x, y: spot.y, z: spot.owner.rz, owner: spot.owner,
    s: rr(0.72, 1.18), rot: rng() * Math.PI * 2, birth: -1, faces: null, simple: null
  };
  makeTreeFaces(e);
  entities.push(e);
  treeCount++;
}

function makeTreeFaces(e) {
  const f = [], g = [];
  const s = e.s, r = e.rot;
  prism(f, 0, 0, 0, 0.30 * s, 0.072 * s, 5, r, CIDX.trunk);

  if (e.kind === "autumn" || e.kind === "leaf") {
    const pal = e.kind === "autumn"
      ? [CIDX.autumnA, CIDX.autumnB, CIDX.autumnC]
      : [CIDX.leafA, CIDX.leafB, CIDX.leafC];
    const c = pal[Math.floor(rng() * 3)];
    blob(f, 0, 0, 0.72 * s, 0.40 * s, 0.64 * s, 6, r + 0.3, c);
    blob(g, 0, 0, 0.74 * s, 0.38 * s, 0.58 * s, 5, r, c);
  } else {
    const c = [CIDX.pineA, CIDX.pineB, CIDX.pineC][Math.floor(rng() * 3)];
    cone(f, 0, 0, 0.14 * s, 0.35 * s, 0.72 * s, 6, r, c);
    cone(f, 0, 0, 0.58 * s, 0.24 * s, 0.62 * s, 6, r + 0.5, c);
    cone(g, 0, 0, 0.18 * s, 0.34 * s, 1.02 * s, 5, r, c);
  }
  e.faces = f;
  e.simple = g;
}

/* hay bales, so the fields look worked */
function addHaystack(t) {
  const spot = tileSpot(t, 0.55);
  if (!dryLand(spot.owner)) return;
  const s = rr(0.8, 1.1);
  const f = [];
  cone(f, 0, 0, 0, 0.15 * s, 0.26 * s, 6, rng() * 6, CIDX.cropA);
  cone(f, 0, 0, 0.13 * s, 0.19 * s, 0.09 * s, 6, rng() * 6, CIDX.cropB);
  add("hay", spot.owner, f, { s, x: spot.x, y: spot.y, tiny: TINY_HAY });
}

function addFlowers(t) {
  const spot = tileSpot(t, 0.62);
  if (!dryLand(spot.owner)) return;
  const s = rr(0.7, 1.2);
  const f = [];
  const ci = [CIDX.comb, CIDX.gold, CIDX.churchWall, CIDX.churchRoof][Math.floor(rng() * 4)];
  for (let i = 0; i < 3; i++) {
    const [ox, oy] = off(rng() * 6.28, rr(-0.22, 0.22) * s, rr(-0.22, 0.22) * s);
    box(f, ox, oy, 0, 0.035 * s, 0.035 * s, 0.075 * s, 0, ci);
  }
  add("flowers", spot.owner, f, { s, x: spot.x, y: spot.y, tiny: TINY_FLOWER });
}

function dryLand(t) { return t && t.biome !== BIOME.WATER && t.biome !== BIOME.RIVER; }

function addBush(t) {
  const spot = tileSpot(t, 0.6);
  if (!dryLand(spot.owner)) return;
  const s = rr(0.6, 1.1);
  const f = [];
  blob(f, 0, 0, 0.20 * s, 0.26 * s, 0.30 * s, 5, rng() * 6,
    rng() < 0.5 ? CIDX.leafB : CIDX.leafC);
  entities.push({
    kind: "bush", x: spot.x, y: spot.y, z: spot.owner.rz, owner: spot.owner,
    s, rot: 0, birth: -1, faces: f, simple: null
  });
}

function addRock(t) {
  const spot = tileSpot(t, 0.6);
  if (!dryLand(spot.owner)) return;
  const s = rr(0.5, 1.0);
  const f = [];
  blob(f, 0, 0, 0.15 * s, 0.30 * s, 0.34 * s, 6, rng() * 6, CIDX.rock);
  entities.push({
    kind: "rock", x: spot.x, y: spot.y, z: spot.owner.rz, owner: spot.owner,
    s, rot: 0, birth: -1, faces: f, simple: null
  });
}

   5b.  BUILDINGS AND CREATURES

function add(kind, t, faces, opts) {
  const e = Object.assign({
    kind, x: t.cx, y: t.cy, z: t.rz, owner: t,
    s: 1, rot: 0, birth: -1, faces: faces || [], dyn: null
  }, opts || {});
  entities.push(e);
  return e;
}

/* ---- windmill: a tapered tower, plus sails rebuilt every frame ---- */
function makeWindmill(t) {
  const f = [];
  const s = rr(0.9, 1.15);
  const r = rng() * Math.PI * 2;
  prism(f, 0, 0, 0.00 * s, 0.30 * s, 0.35 * s, 8, r, CIDX.millWall);
  prism(f, 0, 0, 0.30 * s, 0.60 * s, 0.30 * s, 8, r, CIDX.millWall);
  prism(f, 0, 0, 0.60 * s, 0.86 * s, 0.25 * s, 8, r, CIDX.millWall);
  cone(f, 0, 0, 0.86 * s, 0.27 * s, 0.26 * s, 8, r, CIDX.roofA);
  const [dx, dy] = off(r, 0, 0);
  box(f, dx + Math.cos(r) * 0.34 * s, dy + Math.sin(r) * 0.34 * s, 0.02,
    0.02 * s, 0.06 * s, 0.17 * s, r, CIDX.timber);
  return add("windmill", t, f, {
    s, rot: r, spin: rng() * 6.28, spinRate: rr(0.6, 1.1),
    sailCi: CIDX.timber, hubZ: 0.72 * s, hubR: 0.38 * s, dyn: []
  });
}

function windmillSails(e) {
  const f = [], s = e.s, r = e.rot;
  const px = -Math.sin(r), py = Math.cos(r);          // in the sail plane, horizontal
  const hx = Math.cos(r) * e.hubR, hy = Math.sin(r) * e.hubR, hz = e.hubZ;
  for (let k = 0; k < 4; k++) {
    const a = e.spin + k * Math.PI / 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const dx = ca * px, dy = ca * py, dz = sa;
    const tx = -sa * px, ty = -sa * py, tz = ca;
    const P = (rr_, ww) => [hx + dx * rr_ + tx * ww, hy + dy * rr_ + ty * ww, hz + dz * rr_ + tz * ww];
    const r0 = 0.10 * s, r1 = 0.62 * s, w = 0.088 * s;
    slab(f, P(r0, -w), P(r1, -w), P(r1, w), P(r0, w), e.sailCi);
  }
  return f;
}

/* ---- church: nave with a gable roof, tower and spire ---- */
function makeChurch(t) {
  const f = [];
  const s = rr(1.0, 1.2);
  const r = Math.round(rng() * 4) * Math.PI / 2;
  box(f, 0, 0, 0, 0.34 * s, 0.20 * s, 0.26 * s, r, CIDX.churchWall);
  gableRoof(f, 0, 0, 0.26 * s, 0.35 * s, 0.21 * s, 0.22 * s, r, CIDX.churchRoof);
  const [tx, ty] = off(r, 0.38 * s, 0);
  box(f, tx, ty, 0, 0.12 * s, 0.12 * s, 0.64 * s, r, CIDX.churchWall);
  cone(f, tx, ty, 0.64 * s, 0.14 * s, 0.36 * s, 4, r + Math.PI / 4, CIDX.churchRoof);
  box(f, tx, ty, 1.00 * s, 0.011 * s, 0.011 * s, 0.09 * s, r, CIDX.gold);
  box(f, tx, ty, 1.05 * s, 0.033 * s, 0.009 * s, 0.011 * s, r, CIDX.gold);
  return add("church", t, f, { s, rot: r });
}

/* ---- farmhouse barn, with the big doors ---- */
function makeBarn(t) {

function makeWell(t) {

function makeLighthouse(t) {

function boatFaces(s, r) {
  const f = [];
  const HULL = [[0.30, 0], [0.10, 0.13], [-0.22, 0.13], [-0.27, 0], [-0.22, -0.13], [0.10, -0.13]];
  const pts = HULL.map(([x, y]) => off(r, x * s, y * s));
  const h = 0.11 * s;
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6;
    push(f, [[pts[i][0], pts[i][1], 0], [pts[j][0], pts[j][1], 0],
             [pts[j][0], pts[j][1], h], [pts[i][0], pts[i][1], h]], CIDX.hull);
  }
  push(f, pts.map(p => [p[0], p[1], h]), CIDX.plank);
  prism(f, 0, 0, h, h + 0.36 * s, 0.014 * s, 4, r, CIDX.timber);
  const [px, py] = off(r, 1, 0);
  slab(f,
    [0, 0, h + 0.34 * s],
    [px * 0.24 * s, py * 0.24 * s, h + 0.32 * s],
    [px * 0.24 * s, py * 0.24 * s, h + 0.04 * s],
    [0, 0, h + 0.04 * s], CIDX.trim);
  return f;
}

function makeBoat(t) {
  const s = rr(0.85, 1.25), r = rng() * 6.28;
  const e = add("boat", t, boatFaces(s, r), {
    s, rot: r, mobile: true, bob: rng() * 6.28, driftA: rng() * 6.28,
    homeX: t.cx, homeY: t.cy, drift: rr(0.10, 0.22), driftR: rr(0.10, 0.22)
  });
  e.z = t.rz + 0.03;
  return e;
}

function makeBoatFaces(e) { return boatFaces(e.s, e.rot); }

function makeBridge(t) {
  const f = [];
  const r = t.bridgeRot, s = 1.0;
  box(f, 0, 0, 0, 0.90, 0.17, 0.06, r, CIDX.plank);
  [-0.15, 0.15].forEach(side => {
    const [rx, ry] = off(r, 0, side);
    box(f, rx, ry, 0.06, 0.90, 0.02, 0.035, r, CIDX.timber);
    [-0.62, 0, 0.62].forEach(u => {
      const [ux, uy] = off(r, u, side);
      box(f, ux, uy, 0.06, 0.022, 0.022, 0.10, r, CIDX.timber);
    });
  });
  return add("bridge", t, f, { s, rot: r });
}

/* ---- animals ---- */

const SPECIES = {
  sheep: { bodyLen: 0.34, bodyWid: 0.24, bodyH: 0.26, legH: 0.15, headR: 0.082, gait: 6.5,
           bodyCi: "sheep", headCi: "cowPatch", legCi: "cowPatch", speed: 0.55 },
  cow:   { bodyLen: 0.46, bodyWid: 0.26, bodyH: 0.30, legH: 0.24, headR: 0.098, gait: 5.0,
           bodyCi: "cow", headCi: "cow", legCi: "cowPatch", speed: 0.40, patches: true },
  deer:  { bodyLen: 0.40, bodyWid: 0.20, bodyH: 0.23, legH: 0.28, headR: 0.072, gait: 8.0,
           bodyCi: "deer", headCi: "deer", legCi: "deerLight", speed: 0.95, antlers: true },
  goat:  { bodyLen: 0.28, bodyWid: 0.18, bodyH: 0.20, legH: 0.15, headR: 0.066, gait: 7.5,
           bodyCi: "goat", headCi: "goat", legCi: "goatHorn", speed: 0.70, horns: true },
  hen:   { bodyLen: 0.15, bodyWid: 0.12, bodyH: 0.13, legH: 0.065, headR: 0.048, gait: 12,
           bodyCi: "hen", headCi: "hen", legCi: "gold", speed: 0.40, comb: true }
};

function animalFaces(e) {
  const f = [], sp = e.sp, s = e.s, r = e.facing;
  const swing = Math.sin(e.phase) * e.moving;
  const bob = Math.abs(Math.cos(e.phase)) * 0.012 * e.moving * s;
  const bl = sp.bodyLen * s, bw = sp.bodyWid * s, bh = sp.bodyH * s, lh = sp.legH * s;
  const legCi = CIDX[sp.legCi], bodyCi = CIDX[sp.bodyCi], headCi = CIDX[sp.headCi];

  const LX = 0.28 * bl, LY = 0.32 * bw;
  for (let i = 0; i < 4; i++) {
    const ph = (i === 0 || i === 3) ? 1 : -1;
    const [px, py] = off(r, (i < 2 ? LX : -LX) + ph * swing * 0.05 * s, i % 2 ? LY : -LY);
    prism(f, px, py, 0, lh, 0.024 * s, 3, r, legCi);
  }
  blob(f, 0, 0, lh + bh * 0.44 + bob, bl * 0.5, bh, 7, r, bodyCi);
  if (sp.patches) {
    const [qx, qy] = off(r, bl * 0.18, bw * 0.26);
    blob(f, qx, qy, lh + bh * 0.58 + bob, bl * 0.20, bh * 0.55, 5, r + 0.6, CIDX.cowPatch);
  }
  const [hx, hy] = off(r, bl * 0.60, 0);
  blob(f, hx, hy, lh + bh * 0.64 + bob, sp.headR * s, sp.headR * 1.9 * s, 6, r, headCi);
  if (sp.antlers || sp.horns) {
    const ci = sp.antlers ? CIDX.deerLight : CIDX.goatHorn;
    const hh = (sp.antlers ? 0.07 : 0.05) * s;
    [0.7, -0.7].forEach(k => {
      const [ax, ay] = off(r, bl * 0.62, sp.headR * k * s);
      box(f, ax, ay, lh + bh * 0.80 + bob, 0.008 * s, 0.008 * s, hh, r, ci);
    });
  }
  if (sp.comb) {
    const [cx2, cy2] = off(r, bl * 0.58, 0);
    box(f, cx2, cy2, lh + bh * 0.88 + bob, 0.011 * s, 0.011 * s, 0.032 * s, r, CIDX.comb);
  }
  return f;
}

function makeAnimal(t, kind) {
  const e = {
    kind: "animal", species: kind, sp: SPECIES[kind],
    x: t.cx, y: t.cy, z: t.rz, owner: t, s: rr(0.9, 1.15),
    facing: rng() * 6.28, phase: rng() * 6.28, moving: 0, wait: rr(0, 2),
    homeX: t.cx, homeY: t.cy, tx: t.cx, ty: t.cy,
    mobile: true, birth: -1, faces: [], dyn: []
  };
  entities.push(e);
  return e;
}

function pickAnimalTarget(e) {
  for (let tries = 0; tries < 8; tries++) {
    const a = rng() * Math.PI * 2, d = rr(1.0, 4.0);
    const tx = e.homeX + Math.cos(a) * d, ty = e.homeY + Math.sin(a) * d;
    const t = tileAt(tx, ty);
    if (t && walkable(t)) { e.tx = tx; e.ty = ty; return; }
  }
  e.tx = e.homeX; e.ty = e.homeY;
}

function updateAnimal(e, dt) {
  if (e.wait > 0) {
    e.wait -= dt;
    e.moving += (0 - e.moving) * Math.min(1, dt * 5);
    return;
  }
  const dx = e.tx - e.x, dy = e.ty - e.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.10) { e.wait = rr(0.7, 3.4); pickAnimalTarget(e); return; }

  const step = e.sp.speed * dt;
  const nx = e.x + dx / d * step, ny = e.y + dy / d * step;
  const t = tileAt(nx, ny);
  if (!t || !walkable(t)) { pickAnimalTarget(e); return; }
  e.x = nx; e.y = ny; e.owner = t;
  e.z += (t.rz - e.z) * Math.min(1, dt * 8);
  const want = Math.atan2(dy, dx);
  const diff = ((want - e.facing + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  e.facing += diff * Math.min(1, dt * 6);
  e.moving = Math.min(1, e.moving + dt * 4);
  e.phase += dt * e.sp.gait;
}

function decorate() {
  const flatGrass = [];
  tileList.forEach(t => {
    if (t.biome === BIOME.WATER || t.biome === BIOME.RIVER) return;
    if (t.biome === BIOME.FOREST) {
      const n = ri(2, 4);
      for (let i = 0; i < n; i++) addTree(t, true);
      if (rng() < 0.10) addBush(t);
    } else if (t.biome === BIOME.FIELD) {
      if (rng() < 0.05) addRock(t);
      if (rng() < 0.04) addBush(t);
      if (rng() < 0.02) addHaystack(t);
    } else if (t.biome === BIOME.GRASS) {
      const n = rng() < 0.30 ? ri(1, 3) : 0;
      for (let i = 0; i < n; i++) addTree(t, false);
      if (rng() < 0.05) addRock(t);
      if (rng() < 0.12) addBush(t);
      if (rng() < 0.13) addFlowers(t);
      if (t.h > SEA && t.h <= STEP * 3) flatGrass.push(t);
    } else {
      if (rng() < 0.12) addBush(t);
      if (rng() < 0.08) addFlowers(t);
    }
  });

  shuffleSeeded(flatGrass);
  const sites = [];
  for (const t of flatGrass) {
    if (sites.length >= 10) break;
    if (sites.every(s => Math.hypot(s.cx - t.cx, s.cy - t.cy) > 4.6)) {
      sites.push(t);
      placeVillage(t);
    }
  }

  placeLandmarks();
  placeBoats();
  placeBridges();
  placeAnimals(sites);
}

function placeVillage(center) {
  const homes = [center];
  for (let i = 0; i < 6; i++) {
    const d = DIRS[i];
    const n = tiles.get(key(center.q + d[0], center.r + d[1]));
    if (n && n.biome === BIOME.GRASS && rng() < 0.60) homes.push(n);
  }
  homes.forEach((t, i) => {
    if (i > 0 && rng() < 0.22) return;
    const spot = tileSpot(t, i === 0 ? 0.18 : 0.48);
    if (spot.owner.biome !== BIOME.GRASS) return;
    if (i === 0) { makeWell(spot.owner); return; }     // village well at the middle
    const s = rr(0.86, 1.12);
    const rot = Math.round(rng() * 4) * Math.PI / 2 + (rng() < 0.3 ? Math.PI / 4 : 0);
    const f = [];
    const hx = 0.30 * s, hy = 0.24 * s, hh = 0.36 * s;
    box(f, 0, 0, 0, hx, hy, hh, rot, rng() < 0.5 ? CIDX.wallA : CIDX.wallB);
    if (rng() < 0.55) {
      gableRoof(f, 0, 0, hh, hx * 1.06, hy * 1.1, 0.30 * s, rot,
        [CIDX.roofA, CIDX.roofB, CIDX.roofC, CIDX.roofD][Math.floor(rng() * 4)]);
    } else {
      cone(f, 0, 0, hh, Math.max(hx, hy) * 1.34, 0.30 * s, 4, rot + Math.PI / 4,
        [CIDX.roofA, CIDX.roofB, CIDX.roofC, CIDX.roofD][Math.floor(rng() * 4)]);
    }
    if (rng() < 0.5) {
      // chimney, offset in the house's own frame so it stays on the roof when rotated
      const [cx2, cy2] = off(rot, 0.15 * s, 0.11 * s);
      box(f, cx2, cy2, hh + 0.12 * s, 0.045 * s, 0.045 * s, 0.22 * s, rot, CIDX.rockDark);
    }
    add("house", spot.owner, f, { s, rot, x: spot.x, y: spot.y });
  });
}

/* Landmarks want specific ground: churches and keeps get the high spots,
   windmills and barns the open flats, lighthouses the coast. */
function placeLandmarks() {
  const open = [], high = [], coast = [];
  tileList.forEach(t => {
    if (t.biome === BIOME.GRASS || t.biome === BIOME.FIELD) {
      if (t.h > SEA && t.h <= STEP * 2) open.push(t);
      if (t.h >= STEP * 3) high.push(t);
    }
    if (t.biome === BIOME.SAND && t.nb.some(n => n && n.biome === BIOME.WATER)) coast.push(t);
  });
  shuffleSeeded(open); shuffleSeeded(high); shuffleSeeded(coast);

  const taken = [];
  const grab = (pool, minGap, budget) => {
    const out = [];
    for (const t of pool) {
      if (out.length >= budget) break;
      if (taken.every(s => Math.hypot(s.cx - t.cx, s.cy - t.cy) > minGap)) {
        taken.push(t); out.push(t);
      }
    }
    return out;
  };

  grab(high, 9, 2).forEach(makeChurch);
  grab(open, 11, ri(3, 5)).forEach(makeWindmill);
  grab(open, 7, ri(3, 5)).forEach(makeBarn);
  grab(high, 12, ri(1, 3)).forEach(makeKeep);
  grab(coast, 14, ri(2, 3)).forEach(makeLighthouse);
}

function placeBridges() {
  tileList.forEach(t => { if (t.bridge) makeBridge(t); });
}

function placeBoats() {
  const water = tileList.filter(t =>
    t.biome === BIOME.WATER && t.nb.some(n => n && n.biome !== BIOME.WATER));
  shuffleSeeded(water);
  water.slice(0, Math.min(18, Math.max(6, Math.floor(water.length * 0.10)))).forEach(makeBoat);
}

function placeAnimals(sites) {
  const graze = [], wood = [], yards = [];
  tileList.forEach(t => {
    if (t.biome === BIOME.GRASS || t.biome === BIOME.FIELD) graze.push(t);
    else if (t.biome === BIOME.FOREST && rng() < 0.45) wood.push(t);
  });
  sites.forEach(s => {
    for (let i = 0; i < 6; i++) {
      const d = DIRS[i];
      const n = tiles.get(key(s.q + d[0], s.r + d[1]));
      if (n && n.biome === BIOME.GRASS) yards.push(n);
    }
  });

  const put = (pool, kind, n) => {
    shuffleSeeded(pool);
    pool.slice(0, n).forEach(t => makeAnimal(t, kind));
  };
  put(graze, "sheep", clampI(Math.round(graze.length * 0.075), 14, 46));
  put(graze, "cow", clampI(Math.round(graze.length * 0.035), 6, 22));
  put(wood, "deer", clampI(Math.round(wood.length * 0.16), 8, 30));
  put(wood, "goat", clampI(Math.round(wood.length * 0.05), 3, 12));
  put(yards, "hen", clampI(yards.length * 2, 6, 30));
}

function clampI(v, a, b) { return v < a ? a : v > b ? b : v; }

/* =========================================================================
   6.  PLAYER
   ========================================================================= */

const player = { x: 0, y: 0, z: 0, facing: 0, walk: 0, moving: 0, run: 0, faces: [] };

function spawnPlayer() {
  /* start in the middle of the valley, not at whichever tile happens to come
     first out of the generator — otherwise you spawn on the coast */
  let home = null, best = Infinity;
  for (const t of tileList) {
    if (t.biome !== BIOME.GRASS || t.h <= SEA || t.h > STEP * 2) continue;
    const d = t.cx * t.cx + t.cy * t.cy;
    if (d < best) { best = d; home = t; }
  }
  if (!home) home = tileList.find(t => dryLand(t)) || tileList[0];
  player.x = home.cx; player.y = home.cy; player.z = home.rz;
  player.facing = 0; player.walk = 0; player.moving = 0;
  cam.x = player.x; cam.y = player.y; cam.z = player.z;
}

function buildPlayer() {
  const f = [];
  const s = 0.78;
  const swing = Math.sin(player.walk) * player.moving;
  const bob = Math.abs(Math.cos(player.walk)) * 0.03 * player.moving;
  const c = Math.cos(player.facing), sn = Math.sin(player.facing);
  const fwd = (dx, dy) => [dx * c - dy * sn, dx * sn + dy * c];

  // legs swing along the character's own forward axis
  [-1, 1].forEach(side => {
    const kick = side * swing * 0.10 * s;
    const [lx, ly] = fwd(0.105 * s + kick, 0);
    box(f, lx, ly, 0.02, 0.055 * s, 0.045 * s, 0.30 * s, player.facing, CIDX.trousers);
  });

  const zb = 0.30 * s + bob;
  box(f, 0, 0, zb, 0.155 * s, 0.125 * s, 0.36 * s, player.facing, CIDX.coat);

  [-1, 1].forEach(side => {
    const kick = -side * swing * 0.075 * s;
    const [ax, ay] = fwd(0.20 * s + kick, 0);
    box(f, ax, ay, zb + 0.05 * s, 0.045 * s, 0.045 * s, 0.24 * s, player.facing, CIDX.coat);
  });

  const hz = zb + 0.36 * s + 0.11 * s;
  blob(f, 0, 0, hz, 0.115 * s, 0.20 * s, 6, player.facing, CIDX.skin);
  cone(f, 0, 0, hz + 0.07 * s, 0.115 * s, 0.10 * s, 6, player.facing, CIDX.hat);

  player.faces = f;
}

/* =========================================================================
   7.  CAMERA + PROJECTION
   ========================================================================= */

const PITCH = 0.60;
const SINP = Math.sin(PITCH), COSP = Math.cos(PITCH);
const cam = { x: 0, y: 0, z: 0, c: 1, s: 0, yaw: 0.5, zoom: 52, target: 52 };
const view = { w: 0, h: 0, dpr: 1 };

function project(x, y, z, out) {
  const dx = x - cam.x, dy = y - cam.y;
  const rx = dx * cam.c - dy * cam.s;
  const ry = dx * cam.s + dy * cam.c;
  out.x = view.w * 0.5 + rx * cam.zoom;
  out.y = view.h * 0.60 + (-ry * SINP - (z - cam.z) * COSP) * cam.zoom;
  out.d = ry;
  return out;
}

/* Light lives in view space, so shading holds still while the camera turns.
   Rotating it back into world space each frame keeps the sun glued to the
   screen instead of swinging round the valley. */
const LV = [-0.45, -0.30, 0.84];
let LWx = LV[0], LWy = LV[1], LWz = LV[2];
function updateLight() {
  LWx = LV[0] * cam.c + LV[1] * cam.s;
  LWy = -LV[0] * cam.s + LV[1] * cam.c;
  LWz = LV[2];
}

function bandOf(n) {
  const d = n[0] * LWx + n[1] * LWy + n[2] * LWz;
  let i = Math.round((d * 0.72 + 0.36) * (BAND_K.length - 1));
  if (i < 0) i = 0; else if (i > BAND_K.length - 1) i = BAND_K.length - 1;
  return i;
}

/* =========================================================================
   8.  RENDER
   ========================================================================= */

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const PBUF = d3.range(8).map(() => ({ x: 0, y: 0 }));
const DRAW = [];
let playerDepth = 0;
let skyGrad = null;

function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = window.innerWidth;
  view.h = window.innerHeight;
  canvas.width = Math.floor(view.w * view.dpr);
  canvas.height = Math.floor(view.h * view.dpr);
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, view.h);
  g.addColorStop(0, "#a4d6ed");
  g.addColorStop(0.34, "#cfe8f4");
  g.addColorStop(0.56, "#e6f0e0");
  g.addColorStop(1, "#dbe6cf");
  skyGrad = g;
}

/* Straight to the context: this runs a few thousand times a frame, and
   d3.path() builds a string, so it would be the wrong tool in this loop.
   d3 carries the world generation, the colour system and the grid maths. */
function fillBuf(n, ci, normal, alpha, seam) {
  const col = SHADES[ci][bandOf(normal)];
  ctx.beginPath();
  ctx.moveTo(PBUF[0].x, PBUF[0].y);
  for (let i = 1; i < n; i++) ctx.lineTo(PBUF[i].x, PBUF[i].y);
  ctx.closePath();
  ctx.fillStyle = col;
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fill();
  if (alpha !== undefined) ctx.globalAlpha = 1;
  /* Anti-aliasing leaves a hairline between two tiles that share an edge at
     the same height, which reads as a grid drawn over the grass. Stroking the
     big flat faces with their own colour closes it. Only worth it on tops. */
  if (seam) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

/* Every solid here is convex, so anything facing away is hidden behind its own
   front. Dropping those roughly halves the fills. */
function facing(n) { return n[0] * cam.s + n[1] * cam.c < 0.02; }

function drawTile(t) {
  const zt = t.rz;

  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6;
    const nb = t.nb[i];
    const zb = nb ? nb.rz : BASE_Z;
    if (zb >= zt - 0.004) continue;
    const ex = (t.wx[i] + t.wx[j]) / 2 - t.cx, ey = (t.wy[i] + t.wy[j]) / 2 - t.cy;
    const L = Math.hypot(ex, ey) || 1;
    const nrm = [ex / L, ey / L, 0];
    if (!facing(nrm)) continue;
    project(t.wx[i], t.wy[i], zt, PBUF[0]);
    project(t.wx[j], t.wy[j], zt, PBUF[1]);
    project(t.wx[j], t.wy[j], zb, PBUF[2]);
    project(t.wx[i], t.wy[i], zb, PBUF[3]);
    fillBuf(4, nb ? t.side : CIDX.base, nrm);
  }

  for (let i = 0; i < 6; i++) project(t.wx[i], t.wy[i], zt, PBUF[i]);
  fillBuf(6, t.top, [0, 0, 1], undefined, true);

  if (t.rows) {
    const rz = zt + 0.012;
    for (let k = 0; k < t.rows.length; k++) {
      const seg = t.rows[k];
      const m = Math.min(seg.length, 8);
      for (let i = 0; i < m; i++) project(seg[i][0], seg[i][1], rz, PBUF[i]);
      fillBuf(m, CIDX.cropB, [0, 0, 1], 0.24);
    }
  }
}

/* Faces of one solid that share a fill colour can go into a single canvas path,
   and one fill draws the lot. A pine's three cones are the same green, so this
   turns ~18 fills into about four. Buckets are keyed by colour AND light band,
   because the band is what actually picks the drawn colour. */
const MAXF = 512;
const NKEYS = CNAMES.length * 8;
const FBUF = new Float64Array(MAXF * 4 * 2);
const FCNT = new Uint8Array(MAXF);
const FKEY = new Uint16Array(MAXF);
const BCOUNT = new Uint16Array(NKEYS);
const BSTART = new Uint16Array(NKEYS);
const BEND = new Uint16Array(NKEYS);
const BIDX = new Uint16Array(MAXF);
const BUSED = new Uint8Array(NKEYS);
const BUSED_LIST = new Uint16Array(NKEYS);

function drawFaces(faces, ox, oy, oz, scale, alpha) {
  const cc = cam.c, cs = cam.s, z = cam.zoom;
  const camX = cam.x, camY = cam.y, camZ = cam.z;
  const halfW = view.w * 0.5, baseY = view.h * 0.60;

  let nf = 0, nused = 0;
  for (let fi = 0; fi < faces.length; fi++) {
    const f = faces[fi], p = f.p, n = p.length;
    if (!facing(f.n)) continue;
    if (nf >= MAXF) break;
    /* projection inlined: this loop runs tens of thousands of times a frame,
       and going through a scratch object for every vertex showed up in the profile */
    for (let i = 0; i < n; i++) {
      const v = p[i];
      const dx = ox + v[0] * scale - camX, dy = oy + v[1] * scale - camY, dz = oz + v[2] * scale - camZ;
      const rx = dx * cc - dy * cs;
      const ry = dx * cs + dy * cc;
      const o = (nf * 4 + i) * 2;
      FBUF[o] = halfW + rx * z;
      FBUF[o + 1] = baseY + (-ry * SINP - dz * COSP) * z;
    }
    const key = f.c * 8 + bandOf(f.n);
    FCNT[nf] = n; FKEY[nf] = key;
    if (!BCOUNT[key]++) { BUSED[key] = 1; BUSED_LIST[nused++] = key; }
    nf++;
  }

  /* counting sort: BCOUNT holds each bucket's size, then doubles as the write
     cursor once BSTART/BEND bracket each run */
  let acc = 0;
  for (let i = 0; i < nused; i++) {
    const k = BUSED_LIST[i];
    BSTART[k] = acc; acc += BCOUNT[k]; BEND[k] = acc;
  }
  for (let i = 0; i < nused; i++) BCOUNT[BUSED_LIST[i]] = 0;
  for (let i = 0; i < nf; i++) { const k = FKEY[i]; BIDX[BSTART[k] + BCOUNT[k]++] = i; }

  if (alpha !== undefined) ctx.globalAlpha = alpha;
  for (let i = 0; i < nused; i++) {
    const k = BUSED_LIST[i];
    ctx.beginPath();
    for (let j = BSTART[k]; j < BEND[k]; j++) {
      const fi = BIDX[j], n = FCNT[fi], base = fi * 8;
      ctx.moveTo(FBUF[base], FBUF[base + 1]);
      for (let q = 1; q < n; q++) ctx.lineTo(FBUF[base + q * 2], FBUF[base + q * 2 + 1]);
      ctx.closePath();
    }
    ctx.fillStyle = SHADES[k >> 3][k & 7];
    ctx.fill();
    /* BCOUNT doubled as the write cursor during placement, so it has to go back
       to zero — leave it dirty and the next call thinks every bucket is used,
       marks nothing, and silently draws nothing at all. */
    BUSED[k] = 0;
    BCOUNT[k] = 0;
  }
  if (alpha !== undefined) ctx.globalAlpha = 1;
}

const TREE_KINDS = { pine: 1, leaf: 1, autumn: 1 };
const FADE_R2 = 2.6 * 2.6;

/* Walking into a wood swallows the character completely, so anything standing
   between the camera and the player drops back to a ghost. */
function occluderAlpha(e) {
  if (!TREE_KINDS[e.kind]) return undefined;
  if (e.owner._d >= playerDepth) return undefined;      // behind the player, leave it
  const dx = e.x - player.x, dy = e.y - player.y;
  return dx * dx + dy * dy < FADE_R2 ? 0.20 : undefined;
}

/* A tree two hundred metres away covers a dozen pixels, so it doesn't need
   three cones and two canopies. Distance LOD is most of the frame budget here:
   a thousand trees at full detail is ~25k faces. */
const LOD_R2 = 9.5 * 9.5;
const TINY_FLOWER = 34, TINY_HAY = 26;   // zoom below which these are specks

function drawEntity(e) {
  const lod = (cam.zoom < 44 || !e._near) && e.simple && e.simple.length;
  const grow = e.birth >= 0 ? Math.min(1, (now - e.birth) / 0.35) : 1;
  const s = e.s * (0.45 + 0.55 * grow) * (1 + (1 - grow) * 0.3);
  const alpha = occluderAlpha(e);
  if (!lod && e.dyn && e.dyn.length) drawFaces(e.dyn, e.x, e.y, e.z, s, alpha);
  drawFaces(lod ? e.simple : e.faces, e.x, e.y, e.z, s, alpha);
}

/* Only animate what's near enough to see move. Everything else holds its pose,
   which keeps a valley full of livestock cheap. */
const ANIM_R2 = 28 * 28;

function updateEntities(dt) {
  for (let i = 0; i < entities.length; i++) {
    const e = entities[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    const d2 = dx * dx + dy * dy;
    const near = d2 < ANIM_R2;
    e._near = d2 < LOD_R2;                  // distance LOD, read by drawEntity

    if (e.kind === "windmill") {
      if (near) {
        e.spin += dt * e.spinRate;
        e.dyn = windmillSails(e);
      }
    } else if (e.kind === "animal") {
      if (near) {
        updateAnimal(e, dt);
        e.dyn = animalFaces(e);
      }
    } else if (e.kind === "boat") {
      if (near) {
        e.bob += dt * 1.3;
        e.driftA = (e.driftA || 0) + dt * e.drift;
        e.x = e.homeX + Math.cos(e.driftA) * e.driftR;
        e.y = e.homeY + Math.sin(e.driftA) * e.driftR;
        e.z = e.owner.rz + 0.03 + Math.sin(e.bob) * 0.022;
        e.rot = e.driftA + Math.PI / 2;
        e.faces = makeBoatFaces(e);
      }
    }
  }
}

const SHADOW_PTS = d3.range(8).map(i => {
  const a = i * Math.PI / 4;
  return [Math.cos(a) * 0.30, Math.sin(a) * 0.30 * 0.78];
});
function drawPlayer() {
  for (let i = 0; i < 8; i++) {
    project(player.x + SHADOW_PTS[i][0], player.y + SHADOW_PTS[i][1], player.z + 0.02, PBUF[i]);
  }
  fillBuf(8, CIDX.shadow, [0, 0, 1], 0.18);
  drawFaces(player.faces, player.x, player.y, player.z, 1);
}

function render() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, view.w, view.h);

  updateLight();

  DRAW.length = 0;
  const margin = 1.5 * cam.zoom;

  for (let i = 0; i < tileList.length; i++) {
    const t = tileList[i];
    project(t.cx, t.cy, t.rz, PBUF[0]);
    if (PBUF[0].x < -margin || PBUF[0].x > view.w + margin ||
        PBUF[0].y < -margin || PBUF[0].y > view.h + margin) { t._vis = false; continue; }
    t._vis = true;
    t._d = PBUF[0].d - 0.01;                 // entities on it draw just after it
    DRAW.push({ d: PBUF[0].d, k: 0, r: t });
  }

  for (let i = 0; i < entities.length; i++) {
    const e = entities[i];
    /* a creature that has wandered is no longer where its tile says it is, so it
       sorts on its own depth; static things sort with the tile they stand on */
    const mobile = e.mobile;
    if (e.tiny !== undefined && cam.zoom < e.tiny) continue;
    if (!mobile && !e.owner._vis) continue;
    project(e.x, e.y, e.z, PBUF[0]);
    if (PBUF[0].x < -margin || PBUF[0].x > view.w + margin ||
        PBUF[0].y < -margin || PBUF[0].y > view.h + margin) continue;
    DRAW.push({ d: mobile ? PBUF[0].d - 0.02 : e.owner._d, k: 1, r: e });
  }

  playerDepth = project(player.x, player.y, player.z, PBUF[0]).d - 0.02;
  DRAW.push({ d: playerDepth, k: 2, r: null });

  DRAW.sort((p, q) => q.d - p.d);

  for (let i = 0; i < DRAW.length; i++) {
    const it = DRAW[i];
    if (it.k === 0) drawTile(it.r);
    else if (it.k === 1) drawEntity(it.r);
    else drawPlayer();
  }
}

/* =========================================================================
   9.  INPUT
   ========================================================================= */

const keys = Object.create(null);
const TRAP = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar"];
window.addEventListener("keydown", ev => {
  if (TRAP.indexOf(ev.key) >= 0) ev.preventDefault();
  keys[ev.key.toLowerCase()] = true;
  keys[ev.code] = true;
  if (ev.code === "Space" && !ev.repeat) plantTree();
  if (ev.key === "r" || ev.key === "R") newValley();
});
window.addEventListener("keyup", ev => { keys[ev.key.toLowerCase()] = false; keys[ev.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  cam.target = Math.max(16, Math.min(90, cam.target * (ev.deltaY > 0 ? 0.9 : 1.11)));
}, { passive: false });

const hint = document.getElementById("hint");
let hintTimer = null;
function showHint(msg) {
  hint.innerHTML = msg;
  hint.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove("on"), 2400);
}

let planted = 0;
function plantTree() {
  const px = player.x + Math.cos(player.facing) * 0.95;
  const py = player.y + Math.sin(player.facing) * 0.95;
  const w = worldToAxial(px, py);
  const owner = tiles.get(key(w.q, w.r));
  if (!owner || owner.biome === BIOME.WATER) { showHint("Not in the water, thanks."); return; }

  const e = {
    kind: rng() < 0.6 ? "pine" : "leaf",
    x: px, y: py, z: owner.rz, owner,
    s: rr(0.8, 1.15), rot: rng() * Math.PI * 2, birth: now, faces: null, simple: null
  };
  makeTreeFaces(e);
  entities.push(e);
  treeCount++; planted++;
  if (planted === 1) showHint("Nice. <b>Space</b> plants another.");
  else if (planted === 10) showHint("Ten trees. You're basically a forester now.");
}

/* =========================================================================
   10.  MOVEMENT
   ========================================================================= */

function tileAt(x, y) {
  const w = worldToAxial(x, y);
  return tiles.get(key(w.q, w.r));
}

/* Bridges are the only way over a river, which is the whole point of them. */
function walkable(t) {
  if (!t) return false;
  if (t.biome === BIOME.WATER) return false;
  if (t.biome === BIOME.RIVER && !t.bridge) return false;
  return true;
}

function tryMove(nx, ny) {
  const t = tileAt(nx, ny);
  if (!walkable(t)) return false;
  if (Math.abs(t.rz - player.z) > 0.85) return false;      // no scaling cliffs
  player.x = nx; player.y = ny;
  return true;
}

function update(dt) {
  const turn = (keys["q"] || keys["Q"] ? 1 : 0) - (keys["e"] || keys["E"] ? 1 : 0);
  if (turn) cam.yaw += turn * dt * 1.9;
  cam.c = Math.cos(cam.yaw); cam.s = Math.sin(cam.yaw);

  if (keys["="] || keys["+"]) cam.target = Math.min(90, cam.target * (1 + dt * 1.7));
  if (keys["-"] || keys["_"]) cam.target = Math.max(16, cam.target / (1 + dt * 1.7));
  cam.zoom += (cam.target - cam.zoom) * Math.min(1, dt * 8);

  const ix = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
  const iy = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  const running = !!keys["shift"];
  player.run = running ? 1 : 0;

  if (ix || iy) {
    /* Screen intent -> world. Screen-up is "away from the camera", which is
       +ry, so W has to come through as +iy. It was negated here before, which
       walked you towards the viewer. */
    let dx = ix * cam.c + iy * cam.s;
    let dy = -ix * cam.s + iy * cam.c;
    const L = Math.hypot(dx, dy);
    dx /= L; dy /= L;

    const step = (running ? 8.4 : 4.4) * dt;
    if (tryMove(player.x + dx * step, player.y + dy * step)) { /* clean */ }
    else if (tryMove(player.x + dx * step, player.y)) { dy = 0; }
    else if (tryMove(player.x, player.y + dy * step)) { dx = 0; }
    else { dx = 0; dy = 0; }

    if (dx || dy) {
      const want = Math.atan2(dy, dx);
      const diff = ((want - player.facing + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      player.facing += diff * Math.min(1, dt * 12);
    }
    const moved = (dx || dy) ? 1 : 0;
    player.moving += (moved - player.moving) * Math.min(1, dt * 10);
    player.walk += dt * (running ? 15 : 9.5) * player.moving;
  } else {
    player.moving += (0 - player.moving) * Math.min(1, dt * 12);
  }

  const t = tileAt(player.x, player.y);
  if (t) player.z += (t.rz - player.z) * Math.min(1, dt * 12);

  buildPlayer();
  updateEntities(dt);

  cam.x += (player.x - cam.x) * Math.min(1, dt * 6);
  cam.y += (player.y - cam.y) * Math.min(1, dt * 6);
  cam.z += (player.z - cam.z) * Math.min(1, dt * 6);
}

/* =========================================================================
   11.  BOOT
   ========================================================================= */

let now = 0, last = 0, fpsAcc = 0, fpsN = 0;
const sFps = document.getElementById("sFps");
const sTiles = document.getElementById("sTiles");
const sTrees = document.getElementById("sTrees");
const sWhere = document.getElementById("sWhere");
const seedInput = document.getElementById("seed");

function newValley() {
  const raw = String(seedInput.value || "7").trim();
  let seed = 0;
  for (let i = 0; i < raw.length; i++) seed = (seed * 31 + raw.charCodeAt(i)) | 0;
  buildWorld(seed || 1);
  spawnPlayer();
  planted = 0;
  sTiles.textContent = tileList.length;
  sTrees.textContent = treeCount;
  let beasts = 0;
  for (const e of entities) if (e.kind === "animal" || e.kind === "boat") beasts++;
  document.getElementById("sFolk").textContent = beasts;
}

document.getElementById("regen").addEventListener("click", () => {
  newValley();
  showHint("Valley built from seed <b>" + String(seedInput.value).trim() + "</b>.");
});
seedInput.addEventListener("keydown", ev => { if (ev.key === "Enter") newValley(); });
window.addEventListener("resize", resize);

resize();
newValley();
showHint("Walk about. Press <b>Space</b> to plant a tree.");

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  now += dt;

  update(dt);
  render();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) {
    sFps.textContent = Math.round(fpsN / fpsAcc);
    fpsAcc = 0; fpsN = 0;
    const t = tileAt(player.x, player.y);
    sWhere.textContent = t ? BIOME_NAME[t.biome] : "–";
  }
}
requestAnimationFrame(frame);
</script>
