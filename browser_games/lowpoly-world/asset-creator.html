<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset creator — lowpoly-world</title>
<style>
  :root{
    --ink:#2b3440;
    --panel:rgba(255,253,247,.94);
    --edge:rgba(120,105,80,.28);
    --bg:#e6f0e0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;gap:10px;padding:10px;
  }
  button{
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:inherit;
    background:#e9f0d8;border:1px solid var(--edge);border-radius:8px;padding:5px 11px;
  }
  button:hover{background:#dfe9c8}
  button:disabled{opacity:.4;cursor:default}
  button.on{background:#cfe0b0}
  input,select,textarea{
    font:inherit;font-size:12px;color:inherit;
    border:1px solid var(--edge);border-radius:8px;background:#fff;padding:4px 7px;
  }
  textarea{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.25;
    width:100%;height:100%;resize:none;white-space:pre;overflow:auto;tab-size:1;
  }
  .panel{
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    box-shadow:0 6px 18px rgba(60,50,30,.14);
    display:flex;flex-direction:column;padding:8px;gap:8px;min-height:0;
  }
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar.end{justify-content:space-between}
  .grow{flex:1}
  .label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
  .num{width:58px}
  #top{flex:0 0 auto}
  #mid{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
  #stage{flex:1 1 auto;min-height:0;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:#cfe8f4}
  #view{display:block;width:100%;height:100%}
  #assets{
    flex:0 0 auto;max-height:120px;overflow:auto;
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    box-shadow:0 6px 18px rgba(60,50,30,.14);padding:8px;
  }
  #assets .g{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
  #assets .g:last-child{margin-bottom:0}
  .keybtn{padding:3px 8px;font-size:11.5px;font-weight:500;border-radius:7px}
  #msg{font-size:11.5px;opacity:.72;min-height:15px}
  #measured{font-variant-numeric:tabular-nums;opacity:.72;font-size:11.5px}
</style>
</head>
<body>

<div class="panel" id="top">
  <div class="bar">
    <span class="label">asset</span>
    <input id="id" class="grow" placeholder="animal__sheep" spellcheck="false" autocomplete="off">
    <button id="load">load</button>
    <button id="connect">connect folder</button>
  </div>
</div>

<div id="mid">

  <div class="panel">
    <div class="bar">
      <span class="label">draft</span>
      <button data-draft="1" disabled>1</button>
      <button data-draft="2" disabled>2</button>
      <button data-draft="3" disabled>3</button>
    </div>
    <div style="flex:1 1 auto;min-height:0">
      <textarea id="sketch" spellcheck="false" autocomplete="off" placeholder="the ASCII sketch"></textarea>
    </div>
    <div class="bar end">
      <button id="reloadDraft">reload draft</button>
      <button id="saveMd">save</button>
    </div>
  </div>

  <div class="panel">
    <div class="bar">
      <button id="rotL">L</button>
      <button id="rotR">R</button>
      <span class="grow"></span>
      <button id="zoomOut">&minus;</button>
      <button id="zoomIn">+</button>
    </div>
    <div id="stage"><canvas id="view"></canvas></div>
    <div class="bar">
      <select id="sLayer">
        <option value="outdoor">outdoor</option>
        <option value="indoor">indoor</option>
        <option value="both">both</option>
      </select>
      <span class="label">w</span><input id="sW" class="num">
      <span class="label">h</span><input id="sH" class="num">
      <span class="label">d</span><input id="sD" class="num">
      <span class="grow"></span>
      <span id="measured"></span>
    </div>
    <div class="bar end">
      <button id="reloadAsset">reload asset</button>
      <button id="saveSize">save size</button>
    </div>
  </div>

</div>

<div id="assets"></div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<!-- the shared plumbing, exactly as index.html loads it -->
<script src="assets/core__palette.js"></script>
<script src="assets/core__random.js"></script>
<script src="assets/core__hex.js"></script>
<script src="assets/core__biome.js"></script>
<script src="assets/core__primitives.js"></script>
<script src="assets/core__creature.js"></script>
<script src="assets/core__registry.js"></script>

<!-- there is no world here, so the two collections the world owns are stubbed.
     Nothing in an asset file touches them except tileSpot / groundAt, and both
     degrade to the passed-in tile when the map is empty. -->
<script>
  const tiles = new Map();
  const tileList = [];
  const entities = [];
</script>

<script src="assets/game__camera.js"></script>
<script src="assets/game__render.js"></script>

<script>
"use strict";

/* =========================================================================
   asset-creator — one asset, its sketch, and its declared size
   =========================================================================
   An asset owns a folder, named by its id, holding every file it has:

       assets/<id>/<id>.md      the ASCII sketch        - written here, by "save"
       assets/<id>/<id>.json    layer + w/h/d in units  - written here, by "save size"
       assets/<id>/<id>.js      the entity              - generated by Claude

   Drafts are the same with a suffix: <id>__1.md, <id>__2.md, <id>__3.md.
   The folder is the unit of the asset; `assets/` beside it holds only the
   shared plumbing, core__*.js and game__*.js.
   ========================================================================= */

const GROUPS = ["animal", "building", "nature", "vehicle"];
const DRAFTS = [1, 2, 3];

/* An asset is named by its id alone - `animal__bird` - and every file it owns
   lives in a folder of that name: its .js, its .md, its .json, its drafts.
   The folder carries the name, so the paths are derived from the id and
   nowhere else and cannot drift apart. */
const dirOf = id => "assets/" + id + "/";
const fileOf = id => dirOf(id) + id + ".js";

const KEY_ID = {};        // entity key -> the id that declared it
const ID_KEYS = {};       // id -> the keys it declared, so it can be unloaded
let current = null;       // the selected asset id
let built = null;         // { e, faces, box } for the preview
let dirHandle = null;     // File System Access handle on assets/
let ZOOM = 200;           // preview pixels per unit
let yaw = 0.5;

const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t; };

/* ------------------------------------------------------------ loading --- */

/* Every asset in index.html, in its order. index.html is already the manifest
   of what the game loads, so it cannot drift from the truth. */
async function assetIds() {
  const html = await (await fetch("index.html")).text();
  const out = [];
  for (const m of html.matchAll(/src="assets\/((animal|building|nature|vehicle)__[a-z0-9_]+)\/\1\.js"/g)) {
    out.push(m[1]);
  }
  return out;
}

/* Run a file with INDIRECT eval, so re-running it on reload does not trip the
   const redeclaration a second <script> tag would. It has to be indirect, not
   new Function: `defTree` is a function declaration in nature__tree.js and the
   other tree files call it, and only a global eval puts it on the global. A
   const declared in eval'd code stays in that eval, which is what makes the
   reload safe. defEntity throws on a duplicate key, so the old ones go first. */
async function loadAsset(id) {
  let src;
  try {
    const r = await fetch(fileOf(id), { cache: "no-store" });
    if (!r.ok) { msg(id + " - no such asset (" + r.status + ")"); return false; }
    src = await r.text();
  } catch (err) { msg(id + " - " + err.message); return false; }

  unloadAsset(id);
  const before = new Set(Object.keys(DEF_BY_KEY));
  try {
    (0, eval)(src);
  } catch (err) {
    msg(id + ".js failed: " + err.message);
    console.error(id, err);
    return false;
  }
  const keys = Object.keys(DEF_BY_KEY).filter(k => !before.has(k));
  ID_KEYS[id] = keys;
  for (const k of keys) KEY_ID[k] = id;
  return true;
}

function unloadAsset(id) {
  for (const k of ID_KEYS[id] || []) {
    delete DEF_BY_KEY[k];
    const i = DEFS.findIndex(d => d.key === k);
    if (i >= 0) DEFS.splice(i, 1);
  }
  ID_KEYS[id] = [];
}

/* ------------------------------------------------------------- listing --- */

function listAssets() {
  const box = $("assets");
  box.innerHTML = "";
  const byGroup = {};
  for (const k of Object.keys(DEF_BY_KEY).sort()) {
    (byGroup[DEF_BY_KEY[k].group] ||= []).push(k);
  }
  for (const g of GROUPS) {
    if (!byGroup[g]) continue;
    const row = document.createElement("div");
    row.className = "g";
    const tag = document.createElement("span");
    tag.className = "label";
    tag.textContent = g;
    row.appendChild(tag);
    for (const k of byGroup[g]) {
      const b = document.createElement("button");
      b.className = "keybtn" + (k === current ? " on" : "");
      b.textContent = k;
      b.onclick = () => select(KEY_ID[k]);
      row.appendChild(b);
    }
    box.appendChild(row);
  }
}

/* ---------------------------------------------------------- the entity --- */

/* Build one entity the way spawnEntity would, but with a bare tile and no
   world. Returns its face list, however that asset chooses to make it. */
function buildEntity(key) {
  const def = DEF_BY_KEY[key];
  /* every field an entity file reads off its tile, so a bare tile still
     builds. bridge reads bridgeRot, so leaving it out gives NaN geometry. */
  const t = { q: 0, r: 0, rz: 0, cx: 0, cy: 0, h: 0, moist: 0.5, season: 0.5,
              biome: BIOME.GRASS, nb: new Array(6).fill(null), wx: [], wy: [],
              bridge: false, bridgeRot: 0 };
  let part = null;
  try { part = def.create({ t, h: H }); }
  catch (err) { console.warn(key, err); }
  if (!part) part = {};

  const e = Object.assign({
    key, def, group: def.group, x: 0, y: 0, z: 0, owner: t,
    s: 1, rot: 0, faces: [], dyn: null, sizeMul: def.sizeMul || 1,
    mobile: !!def.mobile, flying: !!def.flying, birth: -1
  }, part);

  /* three ways an asset builds its geometry: create, treeFaces, anim */
  let faces = e.faces && e.faces.length ? e.faces : null;
  if (!faces && def.draw2d && typeof treeFaces === "function") {
    try { treeFaces(e, key, H); faces = e.faces; } catch (err) { console.warn(key, err); }
  }
  if (!faces || !faces.length) {
    if (def.anim) { try { def.anim(e, 0.016, H); } catch (err) { console.warn(key, err); } }
    faces = e.dyn || [];
  }
  return { e, faces };
}

function bounds(faces) {
  let a = [Infinity, Infinity, Infinity], b = [-Infinity, -Infinity, -Infinity];
  for (const f of faces) for (const p of f.p) {
    for (let i = 0; i < 3; i++) { if (p[i] < a[i]) a[i] = p[i]; if (p[i] > b[i]) b[i] = p[i]; }
  }
  if (a[0] === Infinity) return null;
  return { a, b, w: b[0] - a[0], h: b[2] - a[2], d: b[1] - a[1] };
}

/* ------------------------------------------------------------ preview --- */

function fit() {
  const r = $("stage").getBoundingClientRect();
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = Math.max(1, r.width);
  view.h = Math.max(1, r.height);
  const c = $("view");
  c.width = Math.floor(view.w * view.dpr);
  c.height = Math.floor(view.h * view.dpr);
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
}

function declared() {
  const layer = $("sLayer").value;
  const size = { w: +$("sW").value || 0, h: +$("sH").value || 0, d: +$("sD").value || 0 };
  return { layer, size };
}

function line(p, q, style, width) {
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(q.x, q.y);
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.stroke();
}

/* A unit grid on the ground, and the declared box drawn over it. The grid is
   the scale — one square is one unit of whatever the asset's numbers mean. */
function drawGrid(box) {
  const p = { x: 0, y: 0, d: 0 }, q = { x: 0, y: 0, d: 0 };
  if (!box) return;
  const x0 = Math.floor(box.a[0]) - 1, x1 = Math.ceil(box.b[0]) + 1;
  const y0 = Math.floor(box.a[1]) - 1, y1 = Math.ceil(box.b[1]) + 1;
  const g = "rgba(120,105,80,.30)", bold = "rgba(120,105,80,.55)";
  for (let x = x0; x <= x1; x++) {
    project(x, y0, 0, p); project(x, y1, 0, q);
    line(p, q, x === 0 ? bold : g, 1);
  }
  for (let y = y0; y <= y1; y++) {
    project(x0, y, 0, p); project(x1, y, 0, q);
    line(p, q, y === 0 ? bold : g, 1);
  }
}

function drawDeclared(box) {
  const { w, h, d } = declared().size;
  if (!box || (!w && !h && !d)) return;
  const cx = (box.a[0] + box.b[0]) / 2, cy = (box.a[1] + box.b[1]) / 2, z0 = box.a[2];
  const hw = w / 2, hd = d / 2, z1 = z0 + h;
  const P = [];
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    P.push([cx + x * hw, cy + y * hd]);
  }
  const a = { x: 0, y: 0, d: 0 }, b = { x: 0, y: 0, d: 0 };
  const style = "rgba(201,79,58,.75)";
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    project(P[i][0], P[i][1], z0, a); project(P[j][0], P[j][1], z0, b); line(a, b, style, 1.5);
    project(P[i][0], P[i][1], z1, a); project(P[j][0], P[j][1], z1, b); line(a, b, style, 1.5);
    project(P[i][0], P[i][1], z0, a); project(P[i][0], P[i][1], z1, b); line(a, b, style, 1.5);
  }
}

function draw() {
  fit();
  cam.x = 0; cam.y = 0;
  cam.c = Math.cos(yaw); cam.s = Math.sin(yaw); cam.yaw = yaw;
  cam.zoom = ZOOM;
  updateLight();
  updateOutline();

  ctx.clearRect(0, 0, view.w, view.h);
  if (!built) { $("measured").textContent = ""; return; }

  cam.z = built.box ? (built.box.a[2] + built.box.b[2]) / 2 : 0;
  drawGrid(built.box);
  drawDeclared(built.box);
  drawFaces(built.faces, 0, 0, 0, 1);

  const b = built.box;
  $("measured").textContent = b
    ? `measured  ${b.w.toFixed(2)} x ${b.h.toFixed(2)} x ${b.d.toFixed(2)}`
    : "no geometry";
}

/* ------------------------------------------------------------- files --- */

async function readText(id, name) {
  try {
    const r = await fetch(dirOf(id) + name, { cache: "no-store" });
    return r.ok ? await r.text() : null;
  } catch { return null; }
}

async function getDir() {
  if (dirHandle) return dirHandle;
  if (!window.showDirectoryPicker) return null;
  try {
    dirHandle = await window.showDirectoryPicker({ id: "lowpoly-assets", mode: "readwrite" });
    msg("folder connected - save writes into it");
  } catch { /* cancelled */ }
  return dirHandle;
}

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  msg("downloaded " + name + " - move it into assets/");
}

/* Writes into the asset's own folder, creating it if this is a brand new
   asset. The connected folder is assets/ itself. */
async function writeAsset(id, name, text) {
  const dir = await getDir();
  if (!dir) { download(name, text); return; }
  try {
    const sub = await dir.getDirectoryHandle(id, { create: true });
    const fh = await sub.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(text); await w.close();
    msg("saved " + dirOf(id) + name);
  } catch (err) { msg("save failed: " + err.message); }
}

function sketchText() {
  return $("sketch").value.replace(/\s+$/, "") + "\n";
}

/* ---------------------------------------------------------- selecting --- */

async function select(id, reload) {
  if (reload || !ID_KEYS[id] || !ID_KEYS[id].length) {
    if (!await loadAsset(id)) return;      // current stays on the last good one
  }
  const keys = ID_KEYS[id] || [];
  if (!keys.length) { msg(id + " declared no entity"); return; }

  current = id;
  $("id").value = id;

  const { e, faces } = buildEntity(keys[0]);
  built = { e, faces, box: bounds(faces) };

  const md = await readText(id, id + ".md");
  if (md !== null) $("sketch").value = md.replace(/\n$/, "");

  const js = await readText(id, id + ".json");
  if (js) {
    try {
      const j = JSON.parse(js);
      const s = j[j.layer] || j.outdoor || j.indoor || {};
      $("sLayer").value = j.layer || "outdoor";
      $("sW").value = s.w ?? ""; $("sH").value = s.h ?? ""; $("sD").value = s.d ?? "";
    } catch { msg("bad json for " + id); }
  } else {
    $("sW").value = ""; $("sH").value = ""; $("sD").value = "";
  }

  await refreshDrafts();
  listAssets();
  draw();
  msg(keys.join(", ") + " - " + faces.length + " faces");
}

async function refreshDrafts() {
  for (const n of DRAFTS) {
    const b = document.querySelector(`[data-draft="${n}"]`);
    const txt = await readText(current, `${current}__${n}.md`);
    b.disabled = txt === null;
    b.title = txt === null ? "no draft" : `${current}__${n}.md`;
    b.dataset.text = txt || "";
  }
}

/* ------------------------------------------------------------- wiring --- */

$("load").onclick = () => { const v = $("id").value.trim(); if (v) select(v, true); };
$("id").addEventListener("keydown", e => { if (e.key === "Enter") $("load").click(); });

for (const n of DRAFTS) {
  document.querySelector(`[data-draft="${n}"]`).onclick = ev => {
    $("sketch").value = ev.target.dataset.text.replace(/\n$/, "");
    msg("draft " + n + " copied into the canvas");
  };
}

$("reloadDraft").onclick = refreshDrafts;
$("saveMd").onclick = () => writeAsset(current, current + ".md", sketchText());
$("reloadAsset").onclick = () => select(current, true);

$("saveSize").onclick = () => {
  const { layer, size } = declared();
  const j = { layer };
  if (layer === "outdoor" || layer === "both") j.outdoor = size;
  if (layer === "indoor" || layer === "both") j.indoor = size;
  writeAsset(current, current + ".json", JSON.stringify(j, null, 2) + "\n");
};

$("connect").onclick = () => getDir().then(d => { if (!d) msg("this browser cannot write files - save will download instead"); });

$("rotL").onclick = () => { yaw -= Math.PI / 8; draw(); };
$("rotR").onclick = () => { yaw += Math.PI / 8; draw(); };
$("zoomIn").onclick = () => { ZOOM *= 1.25; draw(); };
$("zoomOut").onclick = () => { ZOOM /= 1.25; draw(); };
window.addEventListener("resize", () => draw());

/* --------------------------------------------------------------- boot --- */

(async function boot() {
  buildPerm();                     // hash2 reads PERM, which is zeros until this
  msg("loading assets...");
  const ids = await assetIds();
  let n = 0;
  for (const id of ids) if (await loadAsset(id)) n++;
  listAssets();
  msg(n + " assets loaded - pick one, or type an id");
  const first = Object.keys(DEF_BY_KEY).sort()[0];
  if (first) await select(KEY_ID[first]);
})();
</script>
</body>
</html>
