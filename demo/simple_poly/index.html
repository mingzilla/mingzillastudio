<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Poly</title>
<style>
  :root{ --ink:#2b3440; --panel:rgba(255,253,247,.90); --edge:rgba(120,105,80,.28); }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#bfe0ef}
  body{
    font-family:ui-rounded,"Segoe UI Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #hud{
    position:fixed;top:14px;left:14px;
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    padding:11px 13px;box-shadow:0 8px 24px rgba(60,50,30,.18);
    backdrop-filter:blur(6px);
  }
  #hud h1{margin:0 0 8px;font-size:14px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;align-items:center}
  .keys kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:#f0ece1;border:1px solid var(--edge);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;white-space:nowrap;
  }
  #hud,#toggle{transition:opacity .25s}
  body.ui-off #hud{opacity:0;pointer-events:none}

  #toggle{
    position:fixed;top:14px;right:14px;
    width:32px;height:32px;padding:0;border-radius:9px;
    background:var(--panel);border:1px solid var(--edge);color:var(--ink);
    font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 6px 18px rgba(60,50,30,.16); opacity:.5;
  }
  #toggle:hover{opacity:1}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="hud">
  <h1>Simple Poly</h1>
  <div class="keys">
    <kbd>W A S D</kbd><span>walk</span>
    <kbd>Shift</kbd><span>run</span>
    <kbd>Q</kbd> <span>turn the camera</span>
    <kbd>E</kbd> <span>turn back</span>
    <kbd>&minus; +</kbd><span>zoom</span>
    <kbd>H</kbd><span>hide this</span>
  </div>
</div>

<button id="toggle" type="button" aria-label="Hide or show the panel">&#9776;</button>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<!-- the low-poly kit -->
<script src="assets/shapes.js"></script>

<!-- one file per thing in the world -->
<script src="assets/character.js"></script>
<script src="assets/sheep.js"></script>
<script src="assets/cow.js"></script>
<script src="assets/tree.js"></script>
<script src="assets/rock.js"></script>

<!-- the game around them -->
<script src="assets/game.js"></script>
</body>
</html>
